[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-note"
version = "1.1.0"
description = "Entropy Note: a NotebookLM-based study material pipeline for structured guides, SVG/Mermaid visuals, and quality reports."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "SOLO + User Collaboration" }
]
dependencies = [
  "anyio==4.13.0",
  "certifi==2026.4.22",
  "greenlet==3.5.0",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.15",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "notebooklm-py==0.4.1",
  "playwright==1.59.0",
  "pyee==13.0.1",
  "Pygments==2.20.0",
  "rich==15.0.0",
  "typing_extensions==4.15.0",
]

[project.scripts]
entropy-note = "main:cli"
entropy-note-login = "login:main"
entropy-note-image-tasks = "run_image_tasks:main"
entropy-note-render-visuals = "run_visual_postprocess:main"

[tool.setuptools]
py-modules = ["main", "login", "run_image_tasks", "run_visual_postprocess"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
